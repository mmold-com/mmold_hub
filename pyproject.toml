[project]
name = "mmold_hub"
authors = [
    { name = "MMold Hub" }
]
description = "MMold Hub custom application for ERPNext"
requires-python = ">=3.14,<3.15"
readme = "README.md"
license = { file = "license.txt" }
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.36.0,<16.37.0"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
